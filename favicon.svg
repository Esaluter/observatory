<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="cosmosBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#030611"/>
    </radialGradient>
    <linearGradient id="planetGrad" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0b142c"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="8" y1="42" x2="56" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e5b967" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Deep space tile -->
  <rect width="64" height="64" rx="14" fill="url(#cosmosBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#1e3a5f" stroke-opacity="0.65" stroke-width="1.5"/>

  <!-- Subtle distant star -->
  <circle cx="49" cy="15" r="2.2" fill="#e5b967"/>
  <circle cx="15" cy="18" r="1.2" fill="#94a3b8" fill-opacity="0.7"/>

  <!-- Back arc of orbital ring -->
  <path d="M11 40.5C8.5 34.5 16.5 25.5 29.5 21C42.5 16.5 54 18 55.5 23.5" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central celestial body -->
  <circle cx="32" cy="32" r="14.5" fill="url(#planetGrad)"/>
  <circle cx="32" cy="32" r="14.5" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Front orbital ring crossing the planet -->
  <path d="M55.5 23.5C57.5 29.5 48.5 38.5 35.5 43C22.5 47.5 13 46.5 11 40.5" stroke="url(#ringGrad)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Orbital observatory satellite point -->
  <circle cx="47.5" cy="37.2" r="2.6" fill="#e5b967"/>
</svg>
